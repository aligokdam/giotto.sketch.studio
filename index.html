</div>

<!-- ======================= STUDIO (editor) ======================= -->
<div id="app" class="studio" hidden>

  <!-- SCREEN 1: UPLOAD -->
  <section id="screen-upload" class="screen active">
    <div class="header-bar">
      <button class="icon-btn" id="btnHome" type="button" data-i18n-aria="ariaHome">
        <svg aria-hidden="true"><use href="#i-back"/></svg>
      </button>
      <div class="header-group">
        <button class="icon-btn" id="btnGuide" type="button" data-i18n-aria="ariaHelp">
          <svg aria-hidden="true"><use href="#i-help"/></svg>
        </button>
        <button class="icon-btn" type="button" data-open-settings data-i18n-aria="navSettings">
          <svg aria-hidden="true"><use href="#i-gear"/></svg>
        </button>
      </div>
    </div>

    <div class="brand">
      <svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>
      <h1 data-i18n="appName">Giotto Sketch Studio</h1>
      <p data-i18n="tagline"></p>
    </div>

    <div class="dropzone panel-surface" id="dropzone" tabindex="0" role="button" data-i18n-aria="ariaUpload">
      <div class="corners" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="dropzone-content">
        <div class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h2 data-i18n="dropTitle"></h2>
        <p class="sub" data-i18n="dropSub"></p>
        <button class="btn primary" id="btnBrowse" type="button" data-i18n="chooseImage"></button>
        <p class="hint" data-i18n="dropHint"></p>
      </div>
      <input type="file" id="fileInput" accept="image/*,.heic,.heif" hidden>
    </div>

    <nav class="legal-links studio-legal" data-i18n-aria="navLegal">
      <a href="#privacy" data-sheet="privacy"><svg aria-hidden="true"><use href="#i-lock"/></svg><span data-i18n="privacyPolicy"></span></a>
      <span aria-hidden="true">·</span>
      <a href="#terms" data-i18n="termsLink"></a>
    </nav>
  </section>

  <!-- SCREEN 2: EDITOR -->
  <section id="screen-editor" class="screen">
    <div class="top-bar">
      <button class="icon-btn" id="btnBackToUpload" type="button" data-i18n-aria="ariaBack">
        <svg aria-hidden="true"><use href="#i-back"/></svg>
      </button>
      <span class="title" data-i18n="adjustTitle"></span>
      <button class="icon-btn" type="button" data-open-settings data-i18n-aria="navSettings">
        <svg aria-hidden="true"><use href="#i-gear"/></svg>
      </button>
    </div>

    <div class="editor-canvas-wrap">
      <div class="frame">
        <canvas id="editCanvas"></canvas>
      </div>
    </div>

    <div class="panel panel-surface" id="editPanel">
      <div class="filters-row" id="filtersRow">
        <button class="filter-chip active" type="button" data-filter="normal" data-i18n="filterNormal"></button>
        <button class="filter-chip" type="button" data-filter="grayscale" data-i18n="filterGrayscale"></button>
        <button class="filter-chip" type="button" data-filter="highcontrast" data-i18n="filterHighContrast"></button>
        <button class="filter-chip" type="button" data-filter="sketch" data-i18n="filterSketch"></button>
        <button class="filter-chip" type="button" data-filter="edgedetect" data-i18n="filterEdgeDetect"></button>
        <button class="filter-chip" type="button" data-filter="blueprint" data-i18n="filterBlueprint"></button>
      </div>

      <div class="slider-group" id="editSliders">
        <div class="slider-row"><label for="s-opacity" data-i18n="lblOpacity"></label><input type="range" id="s-opacity" min="0" max="100" value="100"><span class="val" id="v-opacity">100%</span></div>
        <div class="slider-row"><label for="s-brightness" data-i18n="lblBrightness"></label><input type="range" id="s-brightness" min="0" max="200" value="100"><span class="val" id="v-brightness">100%</span></div>
        <div class="slider-row"><label for="s-contrast" data-i18n="lblContrast"></label><input type="range" id="s-contrast" min="0" max="200" value="100"><span class="val" id="v-contrast">100%</span></div>
        <div class="slider-row"><label for="s-sharpness" data-i18n="lblSharpness"></label><input type="range" id="s-sharpness" min="0" max="100" value="0"><span class="val" id="v-sharpness">0%</span></div>
        <div class="slider-row"><label for="s-edge" data-i18n="lblEdge"></label><input type="range" id="s-edge" min="0" max="100" value="0"><span class="val" id="v-edge">0%</span></div>
        <div class="slider-row"><label for="s-saturation" data-i18n="lblSaturation"></label><input type="range" id="s-saturation" min="0" max="200" value="100"><span class="val" id="v-saturation">100%</span></div>
        <div class="slider-row"><label for="s-blur" data-i18n="lblBlur"></label><input type="range" id="s-blur" min="0" max="20" value="0"><span class="val" id="v-blur">0px</span></div>
      </div>

      <div class="editor-actions">
        <button class="btn" id="btnResetEdits" type="button" data-i18n="reset"></button>
        <button class="btn primary grow" id="btnOpenCamera" type="button" data-i18n="openCamera"></button>
      </div>
    </div>
  </section>

  <!-- SCREEN 3: CAMERA / TRACE -->
  <section id="screen-camera" class="screen">
    <video id="cameraVideo" autoplay playsinline muted></video>

    <div id="overlayWrap">
      <img id="overlayImg" alt="">
    </div>

    <div class="cam-top" id="camTop">
      <button class="icon-btn glassy" id="btnCloseCamera" type="button" data-i18n-aria="ariaCloseCamera">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
      </button>
      <div class="header-group">
        <button class="icon-btn glassy" id="btnLock" type="button" aria-pressed="false" data-i18n-aria="ariaLock">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="icon-btn glassy" id="btnFullscreen" type="button" data-i18n-aria="ariaFullscreen">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="kbd-hint" id="kbdHint">
      <kbd>Space</kbd> <span data-i18n="hintHide"></span> · <kbd>R</kbd> <span data-i18n="hintReset"></span> · <kbd>F</kbd> <span data-i18n="hintFullscreen"></span> · <kbd>←↑→↓</kbd> <span data-i18n="hintMove"></span> · <kbd>Esc</kbd> <span data-i18n="hintExit"></span>
    </div>

    <div class="cam-stack" id="camStack">
      <div class="cam-bottom glass" id="camBottom">
        <div class="row-sliders">
          <div class="slider-row"><label for="o-opacity" data-i18n="lblOpacity"></label><input type="range" id="o-opacity" min="0" max="100" value="70"><span class="val" id="ov-opacity">70%</span></div>
          <div class="slider-row"><label for="o-scale" data-i18n="lblScale"></label><input type="range" id="o-scale" min="20" max="300" value="100"><span class="val" id="ov-scale">100%</span></div>
          <div class="slider-row"><label for="o-rotation" data-i18n="lblRotation"></label><input type="range" id="o-rotation" min="-180" max="180" value="0"><span class="val" id="ov-rotation">0°</span></div>
        </div>
        <div class="flip-row">
          <span class="label" data-i18n="transformLabel"></span>
          <div class="header-group">
            <button class="icon-btn" id="btnFlipH" type="button" data-i18n-aria="ariaFlipH">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v18M6 7l-3 5 3 5M18 7l3 5-3 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn" id="btnFlipV" type="button" data-i18n-aria="ariaFlipV">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12h18M7 6l5-3 5 3M7 18l5 3 5-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn" id="btnResetOverlay" type="button" data-i18n-aria="ariaResetPos">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 1 1 3 6.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 17v-5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>

      <button class="btn primary start-draw-btn" id="btnStartDrawing" type="button" data-i18n="startDrawing"></button>
    </div>

    <!-- Drawing mode: only opacity stays on screen -->
    <div id="drawUI" class="hidden">
      <div class="draw-top">
        <button class="icon-btn glassy" id="btnExitDrawing" type="button" data-i18n-aria="ariaExitDrawing">
          <svg aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="draw-bottom glass">
        <label for="d-opacity" data-i18n="lblOpacity"></label>
        <input type="range" id="d-opacity" min="0" max="100" value="70">
        <span class="val" id="dv-opacity">70%</span>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ======================= SETTINGS SHEET ======================= -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
  <div class="sheet-header">
    <div class="sheet-start">
      <button class="nav-btn" id="sheetBack" type="button" hidden>
        <svg aria-hidden="true"><use href="#i-back"/></svg><span id="sheetBackLabel"></span>
      </button>
    </div>
    <h2 id="sheetTitle"></h2>
    <div class="sheet-end"><button class="nav-btn strong" id="sheetDone" type="button" data-i18n="done"></button></div>
  </div>

  <div class="sheet-body" id="sheetBody">
    <!-- Settings root -->
    <div class="sheet-view" data-view="settings" hidden>
      <div class="group">
        <h3 class="group-title" data-i18n="setGeneral"></h3>
        <ul class="list">
          <li><button class="row" type="button" data-push="language">
            <span class="row-label" data-i18n="langLabel"></span>
            <span class="row-value" id="langValue"></span>
            <svg class="row-chev" aria-hidden="true"><use href="#i-chev"/></svg>
          </button></li>
        </ul>
      </div>

      <div class="group">
        <h3 class="group-title" id="appearanceTitle" data-i18n="setAppearance"></h3>
        <div class="segmented" id="themeSeg" role="radiogroup" aria-labelledby="appearanceTitle">
          <button type="button" role="radio" data-theme-choice="system" data-i18n="themeSystem"></button>
          <button type="button" role="radio" data-theme-choice="light" data-i18n="themeLight"></button>
          <button type="button" role="radio" data-theme-choice="dark" data-i18n="themeDark"></button>
        </div>
        <p class="group-foot" data-i18n="setAppearanceHint"></p>
      </div>

      <div class="group">
        <h3 class="group-title" data-i18n="setInfo"></h3>
        <ul class="list">
          <li><button class="row" type="button" data-push="privacy"><span class="row-label" data-i18n="privacyPolicy"></span><svg class="row-chev" aria-hidden="true"><use href="#i-chev"/></svg></button></li>
          <li><a class="row" href="#terms" data-close-sheet><span class="row-label" data-i18n="termsTitle"></span><svg class="row-chev" aria-hidden="true"><use href="#i-chev"/></svg></a></li>
          <li><a class="row" href="#faq" data-close-sheet><span class="row-label" data-i18n="navFaq"></span><svg class="row-chev" aria-hidden="true"><use href="#i-chev"/></svg></a></li>
          <li><button class="row" type="button" data-push="guide"><span class="row-label" data-i18n="navHowItWorks"></span><svg class="row-chev" aria-hidden="true"><use href="#i-chev"/></svg></button></li>
        </ul>
      </div>

      <div class="group">
        <h3 class="group-title" data-i18n="setAbout"></h3>
        <ul class="list">
          <li><div class="row static"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><span class="row-main"><span class="row-label" data-i18n="appName"></span><span class="row-sub" data-i18n="aboutText"></span></span></div></li>
          <li><div class="row static"><span class="row-label" data-i18n="aboutVersion"></span><span class="row-value" id="appVersion">1.1.1</span></div></li>
          <li><div class="row static"><span class="row-label" data-i18n="aboutLicense"></span><span class="row-value">MIT</span></div></li>
          <li><a class="row" href="https://github.com/aligokdam/giotto.sketch.studio" target="_blank" rel="noopener noreferrer"><span class="row-label" data-i18n="aboutSource"></span><span class="row-value">GitHub</span><svg class="row-chev" aria-hidden="true"><use href="#i-chev"/></svg></a></li>
        </ul>
      </div>

      <div class="group">
        <ul class="list">
          <li><button class="row danger" type="button" id="resetSettings"><span class="row-label" data-i18n="resetSettings"></span></button></li>
        </ul>
      </div>
    </div>

    <!-- Privacy summary -->
    <div class="sheet-view" data-view="privacy" hidden>
      <p class="sheet-lead" data-i18n="privacySheetLead"></p>
      <div class="group">
        <ul class="list">
          <li><div class="row static text-only"><svg class="row-icon" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3.5" width="12" height="9" rx="1.5"/><path d="M6.5 15.5h5"/></svg><span class="row-label" data-i18n="privacyS1"></span></div></li>
          <li><div class="row static text-only"><svg class="row-icon" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5"/><path d="M2.5 9h13M9 2.5c2 2.2 2 10.8 0 13M9 2.5c-2 2.2-2 10.8 0 13"/></svg><span class="row-label" data-i18n="privacyS2"></span></div></li>
          <li><div class="row static text-only"><svg class="row-icon" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 12V4M5.5 7.5L9 4l3.5 3.5M3 14.5h12"/><path d="M3 3l12 12"/></svg><span class="row-label" data-i18n="privacyS3"></span></div></li>
          <li><div class="row static text-only"><svg class="row-icon" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 6.5a1.5 1.5 0 0 1 1.5-1.5h1.6l1.2-1.8h4.4l1.2 1.8H14a1.5 1.5 0 0 1 1.5 1.5v6.5A1.5 1.5 0 0 1 14 14.5H4A1.5 1.5 0 0 1 2.5 13z"/><circle cx="9" cy="9.5" r="2.4"/><path d="M3 3l12 12"/></svg><span class="row-label" data-i18n="privacyS4"></span></div></li>
          <li><div class="row static text-only"><svg class="row-icon" viewBox="0 0 18 18" aria-hidden="true"><ellipse cx="9" cy="4.5" rx="5.5" ry="2"/><path d="M3.5 4.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9"/><path d="M3 3l12 12"/></svg><span class="row-label" data-i18n="privacyS5"></span></div></li>
        </ul>
        <p class="group-foot" data-i18n="privacySheetFoot"></p>
      </div>
    </div>

    <!-- Language -->
    <div class="sheet-view" data-view="language" hidden>
      <div class="group">
        <ul class="list" id="langList" role="radiogroup" data-i18n-aria="langLabel"></ul>
      </div>
    </div>

    <!-- How it works (studio guide) -->
    <div class="sheet-view" data-view="guide" hidden>
      <ol class="guide-steps" id="guideSteps"></ol>
      <p class="guide-privacy" data-i18n="guidePrivacy"></p>
    </div>
  </div>
</div>
</body>
</html>
